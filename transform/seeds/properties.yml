version: 2

seeds:
  - name: plans
    config:
      alias: plans_raw
      schema: staging
      column_types:
        monthly_premium: numeric(10,2)
        deductible: integer
        oop_max: integer
    columns:
      - name: plan_id
        tests:
          - not_null
          - unique

  - name: providers
    config:
      alias: providers_raw
      schema: staging
      column_types:
        zip: text
        phone: text
        npi: text
    columns:
      - name: provider_id
        tests:
          - not_null
          - unique

  - name: members
    config:
      alias: members_raw
      schema: staging
      column_types:
        dob: date
        zip: text
        phone: text
        email: text
        fpl_ratio: numeric(5,2)
        hios_id: text
        ra_mm: numeric(5,3)
        year: integer
    columns:
      - name: member_id
        tests:
          - not_null
          - unique

  - name: enrollments
    config:
      alias: enrollments_raw
      schema: staging
      column_types:
        start_date: date
        end_date: date
        premium_paid: numeric(10,2)
    columns:
      - name: enrollment_id
        tests:
          - not_null
          - unique

  - name: claims
    config:
      alias: claims_raw
      schema: staging
      column_types:
        claim_id: text
        member_id: text
        provider_id: text
        plan_id: text
        service_date: date
        claim_amount: numeric(12,2)
        allowed_amount: numeric(12,2)
        paid_amount: numeric(12,2)
        status: text
        diagnosis_code: text
        procedure_code: text
        charges: numeric(12,2)
        allowed: numeric(12,2)
        clean_claim_status: text
        claim_from: date
        clean_claim_out: date
        utilization: numeric(10,2)
        hcg_units_days: integer
        claim_type: text
        major_service_category: text
        provider_specialty: text
        detailed_service_category: text
        ms_drg: text
        ms_drg_description: text
        ms_drg_mdc: text
        ms_drg_mdc_desc: text
        cpt: text
        cpt_consumer_description: text
        procedure_level_1: text
        procedure_level_2: text
        procedure_level_3: text
        procedure_level_4: text
        procedure_level_5: text
        channel: text
        drug_name: text
        drug_class: text
        drug_subclass: text
        drug: text
        is_oon: integer
        best_contracting_entity_name: text
        provider_group_name: text
        ccsr_system_description: text
        ccsr_description: text
    columns:
      - name: claim_id
        tests:
          - not_null
          - unique

  - name: pharmacy_claims
    config:
      alias: pharmacy_claims_raw
      schema: staging
      column_types:
        pharmacy_claim_id: text
        member_id: text
        plan_id: text
        prescriber_id: text
        pharmacy_npi: text
        pharmacy_name: text
        channel: text
        fill_date: date
        ndc: text
        drug_name: text
        generic_name: text
        brand_name: text
        drug_class: text
        drug_subclass: text
        is_generic: integer
        is_specialty: integer
        formulary_tier: integer
        days_supply: integer
        quantity: integer
        refill_number: integer
        ingredient_cost: numeric(12,2)
        dispensing_fee: numeric(12,2)
        member_copay: numeric(12,2)
        plan_paid: numeric(12,2)
        claim_status: text
        reject_code: text
        reject_description: text
        prior_authorization_request_id: text
    columns:
      - name: pharmacy_claim_id
        tests:
          - not_null
          - unique

  - name: prior_authorization_requests
    config:
      alias: prior_authorization_requests_raw
      schema: staging
      column_types:
        prior_authorization_request_id: text
        member_id: text
        plan_id: text
        prescriber_id: text
        prescriber_specialty: text
        policy_id: text
        ndc: text
        drug_name: text
        request_date: date
        decision_date: date
        turnaround_days: integer
        urgency: text
        decision: text
        denial_reasons: text
        first_fill_date: date
        diagnosis_code: text
        age_at_request: integer
        has_type2_diabetes_diagnosis: boolean
        has_rheumatoid_arthritis_diagnosis: boolean
        hba1c_percent: numeric(4,1)
        hba1c_date: date
        bmi: numeric(4,1)
        weight_comorbidities: text
        weight_comorbidity_count: integer
        lifestyle_program_months: integer
        prior_therapy_drug: text
        prior_therapy_days: integer
        prior_therapy_start_date: date
        prior_therapy_intolerance: boolean
        medullary_thyroid_cancer_history: boolean
        taking_another_glp1: boolean
        tuberculosis_screen_negative: boolean
        rheumatology_consult: boolean
    columns:
      - name: prior_authorization_request_id
        tests:
          - not_null
          - unique

  - name: formulary
    config:
      alias: formulary_raw
      schema: staging
      column_types:
        ndc: text
        drug_name: text
        generic_name: text
        brand_name: text
        drug_class: text
        drug_subclass: text
        is_generic: integer
        is_specialty: integer
        formulary_tier: integer
        requires_prior_authorization: integer
        prior_authorization_policy_id: text
        quantity_limit_per_fill: integer
        standard_days_supply: integer
        wac_per_fill_low: numeric(12,2)
        wac_per_fill_high: numeric(12,2)
    columns:
      - name: ndc
        tests:
          - not_null
          - unique


